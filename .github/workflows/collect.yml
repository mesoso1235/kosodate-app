name: collect

on:
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:
    inputs:
      force_facilities:
        description: "施設データを今すぐ取り直す (1 = はい)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: collector/requirements.txt

      - name: Install requirements
        run: pip install -r collector/requirements.txt

      - name: Test
        run: python -m pytest collector -q

      - name: Collect
        env:
          FORCE_FACILITIES: ${{ github.event.inputs.force_facilities }}
        run: python -m collector.collect

      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain data collector/geocode_cache.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data collector/geocode_cache.json
            git commit -m "data: 自動更新 $(TZ=Asia/Tokyo date +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}" || true
            git push
          else
            echo "no data changes"
          fi
